<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Student Login | Grade 9 IT</title>
		<style>
			*{box-sizing:border-box}
			body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#101b4d,#542b91,#087eaa);background-size:250% 250%;animation:bg 12s ease infinite}
			@keyframes bg{50%{background-position:100% 50%}}
			.panel{width:min(520px,100%);padding:38px;background:#ffffff19;border:1px solid #ffffff50;border-radius:26px;box-shadow:0 25px 65px #050b2b66;backdrop-filter:blur(12px);animation:pop .7s both}
			@keyframes pop{from{opacity:0;transform:scale(.94) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
			h1{margin:0 0 10px;font-size:34px}
			p{color:#e2efff;line-height:1.6}
			.field{margin:22px 0}
			label{display:block;font-weight:bold;margin-bottom:9px}
			input{width:100%;padding:14px 15px;border:2px solid transparent;border-radius:12px;font-size:16px;outline:none}
			input:focus{border-color:#77e5ff;box-shadow:0 0 0 4px #77e5ff33}
			.note{padding:13px 15px;background:#fff2c51c;border:1px solid #ffe49a77;border-radius:12px;font-size:14px;color:#fff1c4;margin:20px 0;line-height:1.5}
			button{width:100%;border:0;border-radius:12px;padding:15px;background:#fff;color:#202657;font-weight:bold;font-size:16px;cursor:pointer;transition:.25s}
			button:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0004}
			.back{display:block;text-align:center;color:#e5f4ff;margin-top:20px;text-decoration:none;font-size:14px}
			@keyframes loginGlow{0%,100%{box-shadow:0 25px 65px #050b2b66}50%{box-shadow:0 28px 75px #50c9ff45}}
			.panel{animation:pop .7s both,loginGlow 5s ease-in-out 1s infinite}
			@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
		</style>
	</head>
	<body>
		<main class="panel">
			<h1>👋 Welcome, learner!</h1>
			<p>Before We Start, Let's Fill This.</p>
			<form action="lesson1.html" method="get">
			<div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Enter your name" maxlength="30" required></div>
			<div class="field"><label for="age">Your age</label><input id="age" name="age" type="number" placeholder="Enter your age" min="5" max="14" required title="This learning website is designed for children aged 5 to 14."></div>
			<div class="note">🧒 <strong>A friendly learning space for children!</strong><br>This website is designed for learners aged 5–14. If you are older, please ask a parent or teacher to help you find a learning resource that is right for you.</div>
			<button type="submit">Continue to Lesson 1 →</button></form><a class="back" href="index.html">← Back to Home</a>
		</main>
	</body>
</html>
